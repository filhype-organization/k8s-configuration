name: Build timoni-runner image

on:
  push:
    paths:
      - 'timoni-runner-image/Dockerfile'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.LOGIN_DOCKER_HUB }}
          password: ${{ secrets.TOKEN_DOCKER_HUB }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: timoni-runner-image
          platforms: linux/amd64
          push: true
          tags: leeson77/timoni-runner:latest,leeson77/timoni-runner:v0.26.0

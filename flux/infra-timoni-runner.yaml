  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/timoni-runner
  prune: true
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: iac-k8s-configuration
  dependsOn:
    - name: infra-traefik
